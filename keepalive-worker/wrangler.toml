name = "mincho-keepalive"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Change to your real Pages address after the first deploy
SITE_URL = "https://mincho-cafe.pages.dev"

[triggers]
# Twice a week: Monday and Thursday 00:17 UTC = 08:17 Singapore time (gaps of 3 and 4 days,
# inside Supabase's 7-day pause window, with room for one failed ping)
crons = ["17 0 * * 1,4"]
